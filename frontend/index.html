<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Control panel for the Telegram channel copier: accounts, channel mappings, filters, transformations, schedules, workers, and message logs."
    />
    <title>TG Copier Plus</title>
    <!-- Theme key must match THEME_STORAGE_KEY in src/theme/constants.ts -->
    <script>
      (function () {
        var KEY = 'tg-copier-theme';
        try {
          var t = localStorage.getItem(KEY) || 'system';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
