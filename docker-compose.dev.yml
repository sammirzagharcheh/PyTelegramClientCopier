services:
  backend:
    command:
      [
        "sh",
        "-c",
        "tg-copier db init-db && uvicorn app.web.app:create_app --host 0.0.0.0 --port 8000 --reload",
      ]
    volumes:
      - app_data:/app/data
      - ./src:/app/src

  frontend-proxy:
    profiles: ["prodlike"]

  frontend-dev:
    image: node:20-alpine
    working_dir: /app
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_PROXY_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"]

volumes:
  frontend_node_modules:
