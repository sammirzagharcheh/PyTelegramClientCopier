# GHCR-based stack (no local build). Used by deploy/scripts/deploy-env.sh
# Overlay with deploy/compose/docker-compose.<env>.yml for ports / project naming.
#
# Unified backend image serves SPA + API on :8000.
#
# Data mounts (per Compose project tgc-<env> → isolated host volumes):
#   app_data   → backend /app/data   = SQLite app.db + sessions + media_assets
#   mongo_data → mongodb /data/db    = MongoDB files
# Optional host bind mounts: docker-compose.bind-mounts.yml (BIND_MOUNTS=1)
# Docs: docs/docker-multi-env.md#data-volumes-sqlite-sessions-media-mongodb

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/sammirzagharcheh/pytelegramclientcopier/backend:latest}
    pull_policy: ${PULL_POLICY:-always}
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongo_data:
  app_data:
