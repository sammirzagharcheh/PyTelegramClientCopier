services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      # Host Docker named volume …_mongo_data → Mongo engine files
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file:
      - docker.env
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      # Panel (SPA + /api) on :80; direct API also on :8000
      - "80:8000"
      - "8000:8000"
    volumes:
      # Host Docker named volume …_app_data → SQLite, sessions, media (/app/data)
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongo_data:
  app_data:
